name: MLB Daily Picks Bot

on:
  schedule:
    - cron: '0 16 * * *'   # 12:00 PM ET — full picks run
    - cron: '0 13 * * *'   # 9:00 AM ET  — grading only
  workflow_dispatch:

jobs:

  # ── JOB 1: Full picks run at 12pm ET ──────────────
  run-picks-bot:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install playwright anthropic python-dotenv \
                      schedule requests

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1208

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Install Playwright deps only (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Create directories
        run: |
          mkdir -p logs
          mkdir -p data

      - name: Create .env file
        run: |
          echo "PROPFINDER_EMAIL=${{ secrets.PROPFINDER_EMAIL }}" >> .env
          echo "PROPFINDER_PASSWORD=${{ secrets.PROPFINDER_PASSWORD }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env
          echo "GMAIL_SENDER=${{ secrets.GMAIL_SENDER }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "GMAIL_RECIPIENT=${{ secrets.GMAIL_RECIPIENT }}" >> .env
          echo "GMAIL_RECIPIENT_2=${{ secrets.GMAIL_RECIPIENT_2 }}" >> .env
          echo "GMAIL_RECIPIENT_3=${{ secrets.GMAIL_RECIPIENT_3 }}" >> .env
          echo "HEADLESS=true" >> .env

      - name: Run MLB Picks Bot
        run: python main.py
        env:
          PROPFINDER_EMAIL: ${{ secrets.PROPFINDER_EMAIL }}
          PROPFINDER_PASSWORD: ${{ secrets.PROPFINDER_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}

      - name: Commit logs to repo
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Picks Bot"
          git add logs/*.json
          git commit -m "Add picks logs for $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picks-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

  # ── JOB 2: Grading only at 9am ET ─────────────────
  run-grader:
    if: github.event.schedule == '0 13 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install python-dotenv requests

      - name: Create directories
        run: |
          mkdir -p logs
          mkdir -p data

      - name: Create .env file
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env
          echo "GMAIL_SENDER=${{ secrets.GMAIL_SENDER }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "GMAIL_RECIPIENT=${{ secrets.GMAIL_RECIPIENT }}" >> .env
          echo "GMAIL_RECIPIENT_2=${{ secrets.GMAIL_RECIPIENT_2 }}" >> .env
          echo "GMAIL_RECIPIENT_3=${{ secrets.GMAIL_RECIPIENT_3 }}" >> .env

      - name: Run Grader
        run: python grader.py

      - name: Upload grader logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grader-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7