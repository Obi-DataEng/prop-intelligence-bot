name: MLB Daily Picks Bot

on:
  workflow_dispatch:

jobs:

  # ── JOB 1: Full picks run ──────────────────────────
  run-picks-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install playwright anthropic python-dotenv \
                      schedule requests

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1217

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Install Playwright deps only (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Create directories
        run: |
          mkdir -p logs
          mkdir -p data

      - name: Create .env file
        run: |
          echo "PROPFINDER_EMAIL=${{ secrets.PROPFINDER_EMAIL }}" >> .env
          echo "PROPFINDER_PASSWORD=${{ secrets.PROPFINDER_PASSWORD }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env
          echo "GMAIL_SENDER=${{ secrets.GMAIL_SENDER }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "GMAIL_RECIPIENT=${{ secrets.GMAIL_RECIPIENT }}" >> .env
          echo "GMAIL_RECIPIENT_2=${{ secrets.GMAIL_RECIPIENT_2 }}" >> .env
          echo "GMAIL_RECIPIENT_3=${{ secrets.GMAIL_RECIPIENT_3 }}" >> .env
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" >> .env
          echo "HEADLESS=true" >> .env
          echo "BALLDONTLIE_API_KEY=${{ secrets.BALLDONTLIE_API_KEY }}" >> .env

      - name: Run MLB Picks Bot
        run: python main.py
        env:
          PROPFINDER_EMAIL: ${{ secrets.PROPFINDER_EMAIL }}
          PROPFINDER_PASSWORD: ${{ secrets.PROPFINDER_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

      - name: Commit logs to repo
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Picks Bot"
          git add -f logs/*.json
          git commit -m "Add picks logs for $(date +%Y-%m-%d)" || echo "No log changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit DB to repo
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Picks Bot"
          git add -f data/mlb_picks.db
          git commit -m "Update picks DB for $(date +%Y-%m-%d)" || echo "No DB changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picks-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7