name: Daily Sports Picks Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sports-picks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-picks-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright anthropic python-dotenv schedule requests

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: |
          PW_VERSION=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Always run this command. On a valid cache hit it only verifies the
      # browser, while a missing or stale browser build is downloaded.
      - name: Install and verify Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify Playwright browser launch
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              print("Playwright Chromium launch verified")
              browser.close()
          PY

      - name: Create directories
        run: |
          mkdir -p logs
          mkdir -p data

      - name: Create .env file
        run: |
          echo "PROPFINDER_EMAIL=${{ secrets.PROPFINDER_EMAIL }}" >> .env
          echo "PROPFINDER_PASSWORD=${{ secrets.PROPFINDER_PASSWORD }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env
          echo "GMAIL_SENDER=${{ secrets.GMAIL_SENDER }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "GMAIL_RECIPIENT=${{ secrets.GMAIL_RECIPIENT }}" >> .env
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" >> .env
          echo "HEADLESS=true" >> .env
          echo "BALLDONTLIE_API_KEY=${{ secrets.BALLDONTLIE_API_KEY }}" >> .env

      - name: Run Daily Sports Picks Bot
        run: python main.py
        env:
          PROPFINDER_EMAIL: ${{ secrets.PROPFINDER_EMAIL }}
          PROPFINDER_PASSWORD: ${{ secrets.PROPFINDER_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

      - name: Commit logs to repository
        if: always()
        run: |
          git config user.email "bot@github.com"
          git config user.name "Picks Bot"
          git add -f logs/*.json
          git diff --cached --quiet || git commit -m "Add picks logs for $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picks-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: warn
