name: MLB Daily Picks Bot

on:
  schedule:
    - cron: '10 17 * * *'  # 12:00 PM ET (16:00 UTC during EDT)
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  run-picks-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Step 1: Checkout code ──────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Python ──────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Step 3: Install dependencies ──────────────
      - name: Install Python dependencies
        run: |
          pip install playwright anthropic python-dotenv \
                      schedule requests

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1208

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps
      
      - name: Install Playwright deps only (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      # ── Step 5: Create required directories ───────
      - name: Create directories
        run: |
          mkdir -p logs
          mkdir -p data

      # ── Step 6: Create .env from secrets ──────────
      - name: Create .env file
        run: |
          echo "PROPFINDER_EMAIL=${{ secrets.PROPFINDER_EMAIL }}" >> .env
          echo "PROPFINDER_PASSWORD=${{ secrets.PROPFINDER_PASSWORD }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env
          echo "GMAIL_SENDER=${{ secrets.GMAIL_SENDER }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "GMAIL_RECIPIENT=${{ secrets.GMAIL_RECIPIENT }}" >> .env
          echo "GMAIL_RECIPIENT_2=${{ secrets.GMAIL_RECIPIENT_2 }}" >> .env
          echo "GMAIL_RECIPIENT_3=${{ secrets.GMAIL_RECIPIENT_3 }}" >> .env
          echo "HEADLESS=true" >> .env

      # ── Step 7: Run the bot ────────────────────────
      - name: Run MLB Picks Bot
        run: python main.py
        env:
          PROPFINDER_EMAIL: ${{ secrets.PROPFINDER_EMAIL }}
          PROPFINDER_PASSWORD: ${{ secrets.PROPFINDER_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}

      # ── Step 8: Upload logs as artifact ───────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picks-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7